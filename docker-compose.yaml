services:
  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - client
      - server
    networks:
      - app_network
    restart: unless-stopped

  client:
    build:
      context: .
      target: client
    networks:
      - app_network
    restart: unless-stopped

  server:
    build:
      context: .
      target: server
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge
